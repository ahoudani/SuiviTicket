<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="notes.css">
<link rel="stylesheet" href="style.css">
<title>Bloc-notes</title>
<link rel="icon" href="assets/favicon.ico" type="image/x-icon">
</head>
<body>
<div class="container">
  <div class="notes-container">
    <div class="notes-header">
      <h1>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 10px;">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14,2 14,8 20,8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10,9 9,9 8,9"/>
        </svg>
        Bloc-notes 
      </h1>
      
      <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html';">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
          <polyline points="15,18 9,12 15,6"/>
        </svg>
        Dashboard
      </button>
    </div>

    <div class="notes-grid">
      <div class="editor-section">
        <div class="editor-header">
          <div class="editor-actions">
            <button class="btn-editor btn-save" onclick="saveNote()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                <polyline points="17,21 17,13 7,13 7,21"/>
                <polyline points="7,3 7,8 15,8"/>
              </svg>
              Sauvegarder
            </button>
            <button class="btn-editor btn-clear" onclick="clearEditor()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3,6 5,6 21,6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
              Effacer
            </button>
          </div>
        </div>
        <div class="editor-content">
          <textarea id="notesEditor" placeholder="Tapez vos notes importantes ici..."></textarea>
        </div>
      </div>

      <div class="sidebar">
        <div class="saved-notes">
          <div class="section-header">Notes sauvegardées</div>
          <div class="section-content" id="savedNotesContainer">
            <p style="color: #6b7280; font-style: italic; text-align: center;">Aucune note sauvegardée</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>Abdessamad.Houdani©2025 Cegid. Tous droits réservés.</p>
  </footer>
</div>

<div id="notification" class="notification"></div>

<script src="notes.js"></script>
<script src="notifications.js"></script>
</body>
</html>
