<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Formulaire Ticket</title>
<link rel="icon" href="assets/favicon.ico" type="image/x-icon">
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Gestion des tickets</h1>
    <p>Système de suivi / XRP-Sprint MTS</p>
  </div>

  <div class="content">
    <div class="actions-bar">
      <h2 id="formTitle" style="color: #1e293b; font-size: 1.5rem; font-weight: 600;"></h2>
      <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html';">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m12 19-7-7 7-7"/>
          <path d="M19 12H5"/>
        </svg>
        Dashboard
      </button>
    </div>

    <div class="form-container">     
      <form id="ticketForm" autocomplete="off">
        <input type="hidden" id="ticketId" />
        
        <div class="form-grid">
          <div class="form-group">
            <label for="numero">Numéro du ticket <span class="required">*</span></label>
            <input type="text" id="numero" placeholder="Ex: PBI-001" />
          </div>
          
          <div class="form-group">
            <label for="type">Type ticket <span class="required">*</span></label>
            <select id="type">
              <option value="PBI">PBI</option>
              <option value="Bug">Bug</option>
              <option value="Spike">Spike</option>
            </select>
          </div>
          
          <div class="form-group full-width">
            <label for="nom">Nom ticket <span class="required">*</span></label>
            <input type="text" id="nom"  placeholder="Description courte du ticket" />
          </div>
          
          <div class="form-group">
            <label for="baseTravail">Base de travail</label>
            <input type="text" id="baseTravail" placeholder="Ex: AHO_DEV_MTS_MASTER" />
          </div>
          
          <div class="form-group">
            <label for="serveurBase">Serveur base</label>
            <select id="serveurBase">
              <option value="Local">Local</option>
              <option value="Distant">Distant</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="cheminGit">Chemin Git local</label>
            <input type="text" id="cheminGit" placeholder="Ex: XRP-HR-Sprint-A" />
          </div>
          
          <div class="form-group">
            <label for="brancheGit">Branche Git</label>
            <input type="text" id="brancheGit" placeholder="Ex: feature/pbi-001" />
          </div>
          
          <div class="form-group">
            <label for="state">État <span class="required">*</span></label>
            <select id="state" >
              <option value="Dev">Dev</option>
              <option value="Test">Test</option>
              <option value="Done">Done</option>
              <option value="StandBy">StandBy</option>
            </select>
          </div>
          
          <div class="form-group full-width">
            <label for="informations">Informations Générales</label>
            <textarea id="informations" placeholder="Décrivez les informations générales du ticket..."></textarea>
          </div>
          
          <div class="form-group full-width">
            <label for="remarques">Remarques</label>
            <textarea id="remarques" placeholder="Ajoutez vos remarques..."></textarea>
          </div>
          
          <div class="form-group full-width">
            <label for="modifications">Modifications à faire</label>
            <textarea id="modifications" placeholder="Listez les modifications nécessaires..."></textarea>
          </div>
          
          <div class="form-group full-width">
            <label for="bobs">Bobs</label>
            <textarea id="bobs" placeholder="Informations supplémentaires..."></textarea>
          </div>
        </div>
        
        <div class="button-group">
          <button type="submit" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17,21 17,13 7,13 7,21"/>
              <polyline points="7,3 7,8 15,8"/>
            </svg>
            Enregistrer
          </button>
          
          <button type="button" id="btnCancel" class="btn btn-secondary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
            Annuler
          </button>
          
          <button type="button" id="btnClear" class="btn btn-outline">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
              <path d="M21 3v5h-5"/>
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
              <path d="M3 21v-5h5"/>
            </svg>
            Vider
          </button>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <p>Abdessamad.Houdani©2025 Cegid. Tous droits réservés.</p>
  </footer>
</div>

<script src="ticket-form.js"></script>
<script src="notifications.js"></script>
</body>
</html>
